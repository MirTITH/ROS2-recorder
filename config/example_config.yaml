# data_recorder example configuration.
# Pass it at launch:  --ros-args -p config_file:=<this file>
#
# Group-based: every group shares one backend + params and lists topics.
# You can paste the output of `ros2 topic list` straight into a group's topics.
# 'backend' defaults to "rosbag" when omitted.

output_dir: "./recordings"      # a timestamped session/ subdir is created here

# 记录标签词表：左栏可点击的标签 chips，按采集会话保存到 annotations.yaml。
# name 必须唯一；color 可省略（默认灰色）。
tags:
  - { name: "成功", color: "#2f9e44" }
  - { name: "失败", color: "#e03131" }
  - { name: "碰撞", color: "#e8590c" }
  - { name: "左手", color: "#1763c9" }
  - { name: "右手", color: "#0ea5b7" }
  - { name: "力控", color: "#7c4dff" }

# 时间标注类型：快捷键 -> 定义。kind 为 point（时间点）或 range（区间）。
# 快捷键是单个数字或字母：数字键主键区/小键盘均可触发，字母不区分大小写。
# 区间标注按两次：第一次在播放头处定起点，移动播放头后再按同一键定终点。
annotation_types:
  "1": { name: "拿起水杯", kind: "point", color: "#1763c9" }   # 主键区 1 或 Numpad 1
  "2": { name: "倒水",     kind: "range", color: "#2f9e44" }   # 主键区 2 或 Numpad 2
  "3": { name: "递水",     kind: "range", color: "#e8a915" }
  "c": { name: "碰撞",     kind: "point", color: "#e03131" }   # 字母 c

groups:
  # Plain topics -> recorded into a single ros2 bag.
  # NOTE: subscriptions adapt to the publishers' offered QoS (like `ros2 bag
  # record`); BEST_EFFORT publishers may drop frames under load by design.
  - topics:
      - /tf
      - /tf_static
      - /joint_states
    backend: rosbag

  # Image topic -> encoded to video with libav (accurate per-frame PTS + sidecar CSV).
  - topics:
      - /camera/image_raw
      - /right_camera/image_raw
      - /left_camera/image_raw
    backend: video
    params:
      codec: "libx264"          # any ffmpeg encoder name: libx264 / libx265 / ...
      crf: 23
      preset: "medium"
      pix_fmt: "yuv420p"
      container: "mp4"
