# data_recorder 配置
# 使用方法：ros2 run data_recorder data_recorder --ros-args -p config_file:="<this file>"

output_dir: "./recordings/gripper_pick_1"

# 标签，用于标注单条数据
# name 必须唯一；color 可省略（默认灰色）。
tags:
  - { name: "成功", color: "#2f9e44" }
  - { name: "失败", color: "#e03131" }
  - { name: "碰撞", color: "#e8590c" }
  - { name: "矿泉水", color: "#1763c9" }
  - { name: "兔子", color: "#0ea5b7" }
  - { name: "胶带", color: "#e8a915" }
  - { name: "外部扰动", color: "#e462f0e5" }

# 时间标注，用于标注一条数据的某个时间点或时间区间。
# 格式如下：
# "<快捷键>": { name: "名称", kind: "range", color: "#1763c9" }
# 其中：
# kind 为 point（时间点）或 range（区间）。
# 快捷键是数字或字母：数字主键区/小键盘均可触发，字母不区分大小写。
# 区间标注按两次：第一次定起点，第二次定终点。
annotation_types:
  "1": { name: "收纳", kind: "range", color: "#1763c9" }
  "2": { name: "取出", kind: "range", color: "#2f9e44" }
  "3": { name: "放置", kind: "range", color: "#e8a915" }
  "c": { name: "碰撞", kind: "point", color: "#e03131" }

groups:
  # Plain topics
  - topics:
      - /gimbal_joint_trajectory_controller/controller_state
      - /gimbal_joint_trajectory_controller/joint_trajectory
      # - /gimbal_joint_trajectory_controller/state
      - /gimbal_joint_trajectory_controller/transition_event

      - /joint_state_broadcaster/transition_event
      - /joint_states

      - /left_arm_controller/controller_state
      - /left_arm_controller/joint_trajectory
      # - /left_arm_controller/state
      - /left_arm_controller/transition_event

      - /left_arm_servo_node/pose_target_cmds

      - /left_force_torque_sensor_broadcaster/transition_event
      - /left_force_torque_sensor_broadcaster/wrench

      - /left_hand_controller/commands
      - /left_hand_controller/transition_event
      - /left_hand_max_finger_force_controller/commands
      - /left_hand_max_finger_force_controller/transition_event
      - /left_gripper_controller/commands
      - /left_gripper_controller/transition_event

      - /parameter_events

      - /right_arm_controller/controller_state
      - /right_arm_controller/joint_trajectory
      # - /right_arm_controller/state
      - /right_arm_controller/transition_event

      - /right_arm_servo_node/pose_target_cmds

      - /right_force_torque_sensor_broadcaster/transition_event
      - /right_force_torque_sensor_broadcaster/wrench

      - /right_hand_controller/commands
      - /right_hand_controller/transition_event
      - /right_hand_max_finger_force_controller/commands
      - /right_hand_max_finger_force_controller/transition_event
      - /right_gripper_controller/commands
      - /right_gripper_controller/transition_event

      - /robot_description
      - /robot_description_semantic

      - /tf
      - /tf_static

      # - /woosh/camera/woosh_head_rgbd/aligned_depth_to_color/camera_info
      # - /woosh/camera/woosh_head_rgbd/aligned_depth_to_color/image_raw
      - /woosh/camera/woosh_head_rgbd/color/camera_info
      - /woosh/camera/woosh_head_rgbd/color/metadata
      - /woosh/camera/woosh_head_rgbd/extrinsics/depth_to_color

      # - /woosh/camera/woosh_left_hand_rgbd/aligned_depth_to_color/camera_info
      # - /woosh/camera/woosh_left_hand_rgbd/aligned_depth_to_color/image_raw
      - /woosh/camera/woosh_left_hand_rgbd/color/camera_info
      - /woosh/camera/woosh_left_hand_rgbd/color/metadata
      - /woosh/camera/woosh_left_hand_rgbd/extrinsics/depth_to_color

      # - /woosh/camera/woosh_right_hand_rgbd/aligned_depth_to_color/camera_info
      # - /woosh/camera/woosh_right_hand_rgbd/aligned_depth_to_color/image_raw
      - /woosh/camera/woosh_right_hand_rgbd/color/camera_info
      - /woosh/camera/woosh_right_hand_rgbd/color/metadata
      - /woosh/camera/woosh_right_hand_rgbd/extrinsics/depth_to_color

      - /xr_teleoperate/head_pose
      - /xr_teleoperate/left/controller_state
      - /xr_teleoperate/left/pose
      - /xr_teleoperate/right/controller_state
      - /xr_teleoperate/right/pose
    backend: rosbag # 记录到 rosbag

  # Image topics
  - topics:
      # 这些 topic 也可以指定 QoS 配置（不指定则使用 ROS 2 默认值），示例如下：
      # - /special_camera/image_raw: { qos: { history: keep_last, depth: 10, reliability: reliable, durability: volatile } }
      # 参数的可选值为：
      # history: keep_last | keep_all
      # reliability: reliable | best_effort | system_default
      # durability: volatile | transient_local | system_default
      - /woosh/camera/woosh_head_rgbd/color/image_raw
      - /woosh/camera/woosh_left_hand_rgbd/color/image_raw
      - /woosh/camera/woosh_right_hand_rgbd/color/image_raw
    backend: video
    params:
      codec: "libx264" # ffmpeg 编码器名称: libx264 / libx265 / ...
      crf: 23
      preset: "medium"
      pix_fmt: "yuv420p"
      container: "mp4"
